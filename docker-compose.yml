services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    ports:
      - '5432:5432'
    volumes:
      - auth_service_pgdata:/var/lib/postgresql/data

volumes:
  auth_service_pgdata:
