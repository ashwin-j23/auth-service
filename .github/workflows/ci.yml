name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 20 is the floor (nodemailer 10 requires it — see package.json's
        # "engines"); 22 is the current LTS. 18 is dropped — it went EOL in
        # April 2025, so it's no longer a realistic target and setup-node
        # flags it as deprecated.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # `npm ci`, not `npm install` — installs exactly what's in
      # package-lock.json, and fails outright if the lockfile and
      # package.json have drifted, instead of silently re-resolving.
      #
      # `--ignore-scripts`: a build pipeline has no reason to trust every
      # dependency's (and sub-dependency's) install/postinstall hooks to
      # run arbitrary code unreviewed — that's a real supply-chain-attack
      # surface, not just a lint nag. Safe here specifically because the
      # one thing in this tree that a postinstall hook would normally do
      # for us (@prisma/client auto-running `prisma generate` after
      # install) is already its own explicit step below regardless.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The Prisma client is generated from prisma/schema.prisma into
      # node_modules/@prisma/client — required before tsc or jest can even
      # import it. This only needs the schema file, not a live database
      # (unit tests replace `prisma` with a deep mock — see
      # tests/mocks/prisma.mock.ts — so no Postgres service container is
      # needed here at all).
      #
      # `npm run prisma:generate`, not `npx prisma generate`: npm run only
      # ever executes the LOCAL binary npm ci just installed into
      # node_modules/.bin — it fails if that binary is missing rather than
      # falling back to fetching and running some arbitrary version of the
      # package on the spot, which is exactly what a bare `npx <package>`
      # invocation can do. Same reasoning for `npm run lint:types` below,
      # in place of `npx tsc --noEmit`.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type-check
        run: npm run lint:types

      - name: Test
        run: npm test
