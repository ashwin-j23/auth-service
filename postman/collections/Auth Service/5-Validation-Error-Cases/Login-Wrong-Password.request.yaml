$kind: http-request
name: 'Login — wrong password (expect generic 401)'
order: 3000
method: POST
url: '{{baseUrl}}/login'
description: |-
  The error message must be "Invalid email or password" regardless of whether
  the email exists or the password is wrong — the backend never reveals which
  field failed (anti-enumeration).
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "definitely-wrong"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('message never reveals which field was wrong', () => {
        pm.expect(pm.response.json().error.message).to.eql('Invalid email or password');
      });
