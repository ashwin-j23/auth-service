$kind: http-request
name: 'Signup — password too short (expect 400)'
order: 2000
method: POST
url: '{{baseUrl}}/signup'
description: Password must be at least 8 characters. "short" (5 chars) should fail validation.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "short-pw-{{$randomInt}}@example.com",
      "password": "short"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
