# Reverse proxy for ashwin.opsmonsters.com -> the `app` service (auth-service),
# reached over the internal docker-compose network as app:4000.
#
# Cloudflare is set to DNS-only (grey cloud) for this record, so traffic
# reaches this box directly and TLS is terminated here via Let's Encrypt
# (see scripts/init-letsencrypt.sh and README.md's deploy section).

upstream auth_service_app {
  server app:4000;
}

# Plain HTTP: serves the ACME http-01 challenge for certbot, and redirects
# everything else to HTTPS. Keep this listening on :80 permanently —
# certbot's renewal re-uses the same challenge path every ~60 days.
server {
  listen 80;
  listen [::]:80;
  server_name ashwin.opsmonsters.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ashwin.opsmonsters.com;

  ssl_certificate     /etc/letsencrypt/live/ashwin.opsmonsters.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ashwin.opsmonsters.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Match the app's TRUST_PROXY=1 setting (one hop) — see .env.example.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location / {
    proxy_pass http://auth_service_app;
  }

  location /health {
    proxy_pass http://auth_service_app;
    access_log off;
  }
}
