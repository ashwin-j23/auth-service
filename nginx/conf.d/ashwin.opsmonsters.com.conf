# Serves the frontend's static build (copied into this container's
# /usr/share/nginx/html by the frontend-build service — see
# docker-compose.yml) and reverse-proxies /api + /health to the `app`
# service (auth-service), reached over the internal docker-compose network
# as app:4000.
#
# Cloudflare is set to DNS-only (grey cloud) for this record, so traffic
# reaches this box directly and TLS is terminated here via Let's Encrypt
# (see scripts/init-letsencrypt.sh and README.md's deploy section).

upstream auth_service_app {
  server app:4000;
}

# Plain HTTP: serves the ACME http-01 challenge for certbot, and redirects
# everything else to HTTPS. Keep this listening on :80 permanently —
# certbot's renewal re-uses the same challenge path every ~60 days.
server {
  listen 80;
  listen [::]:80;
  server_name ashwin.opsmonsters.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ashwin.opsmonsters.com;

  ssl_certificate     /etc/letsencrypt/live/ashwin.opsmonsters.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ashwin.opsmonsters.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Match the app's TRUST_PROXY=1 setting (one hop) — see .env.example.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The frontend's static build (see docker-compose.yml's frontend-build
  # service). try_files falls back to index.html for any path that isn't a
  # real file — required for a client-side-routed SPA (react-router): a
  # hard refresh on e.g. /dashboard has no matching file on disk, so nginx
  # must still hand back index.html and let the app's own router take it
  # from there, rather than 404ing.
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Everything the frontend calls at a relative /api/... path (see
  # frontend/vite.config.ts's dev proxy and frontend/.env.production) —
  # same-origin in production, exactly like the dev-server proxy.
  location /api/ {
    proxy_pass http://auth_service_app;
  }

  location /health {
    proxy_pass http://auth_service_app;
    access_log off;
  }
}
