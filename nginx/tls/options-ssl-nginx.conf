# Certbot's recommended nginx TLS settings (the same content certbot's own
# --nginx plugin would generate). Bundled here instead of fetched from
# GitHub at deploy time — scripts/init-letsencrypt.sh used to curl this from
# certbot's repo, which broke the day that repo's default branch/path
# changed (a real outage this project hit — see git history). No good
# reason for a one-time TLS bootstrap to depend on GitHub being reachable
# and unchanged.
ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
