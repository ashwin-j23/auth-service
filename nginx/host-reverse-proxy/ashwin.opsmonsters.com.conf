# Reference vhost for the shared-box deploy path (see README.md's
# "Deploying behind an existing reverse proxy" section) — this is NOT read
# by docker-compose.yml or by anything in this repo. Copy it onto the
# server's own nginx (this box keeps its vhosts directly in
# /etc/nginx/conf.d/ — see the Vaultwarden one already there) alongside its
# other sites' configs.
#
# Assumes: `docker compose up -d postgres migrate app` is running with the
# app bound to 127.0.0.1:4000 (docker-compose.yml's default), and
# TRUST_PROXY=1 is set in .env so the app trusts this one proxy hop.
#
# IMPORTANT — deploy order: this is the PRE-CERTIFICATE bootstrap version,
# HTTP only. Do not hand-add a `listen 443 ssl` block pointing at a cert
# that doesn't exist yet — `certbot --nginx` runs `nginx -t` before it will
# even try to obtain one, so a config that already references a missing
# cert file fails immediately and certbot never gets the chance to fix it.
#
# Install this file as-is, confirm it with `nginx -t`, reload nginx, then
# run:
#   certbot --nginx -d ashwin.opsmonsters.com
# Certbot's nginx plugin finds this server block on port 80, completes the
# HTTP-01 challenge through it, and then EDITS THIS FILE ITSELF to add the
# `listen 443 ssl`/`ssl_certificate`/redirect lines (each tagged "# managed
# by Certbot") — that's exactly how the box's other vhosts, e.g. Vaultwarden's,
# ended up in their current two-server-block shape. Don't pre-write that
# part by hand.

server {
    listen 80;
    server_name ashwin.opsmonsters.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }
}
