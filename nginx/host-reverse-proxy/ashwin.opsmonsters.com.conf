# Reference vhost for the shared-box deploy path (see README.md's
# "Deploying behind an existing reverse proxy" section) — this is NOT read
# by docker-compose.yml or by anything in this repo. Copy it onto the
# server's own nginx (e.g. /etc/nginx/sites-available/ashwin.opsmonsters.com,
# then symlink into sites-enabled) alongside its other sites' vhosts — the
# same host that already runs configs like this one for its other domains.
#
# Assumes: `docker compose up -d postgres migrate app` is running with the
# app bound to 127.0.0.1:4000 (docker-compose.yml's default), and
# TRUST_PROXY=1 is set in .env so the app trusts this one proxy hop.
#
# First issue the cert the same way the box's other sites get theirs, e.g.:
#   sudo certbot --nginx -d ashwin.opsmonsters.com
# which will rewrite the `listen 443`/ssl_certificate lines below itself —
# the ones here are placeholders matching certbot's usual output.

server {
    server_name ashwin.opsmonsters.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ashwin.opsmonsters.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ashwin.opsmonsters.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ashwin.opsmonsters.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name ashwin.opsmonsters.com;
    listen 80;
    return 404; # managed by Certbot
}
